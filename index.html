<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4a3728">
<title>Casas — Property Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --sand:#f5efe6; --cream:#fbf8f3; --paper:#ffffff;
  --bark:#4a3728; --bark-2:#3b2c20; --deep:#1f1914;
  --clay:#c4845a; --terracotta:#b85c38; --terracotta-2:#9e4b2c;
  --muted:#857464; --faint:#b3a493; --border:#e6dccf; --border-2:#d8cabb;
  --green:#2f855a; --green-bg:#e6f4ea; --amber:#b7791f; --amber-bg:#fdf3dc;
  --red:#c0392b; --red-bg:#fde8e6; --grey-bg:#efe9e1; --blue:#2b6cb0; --blue-bg:#e6effa;
  --radius:12px; --shadow:0 1px 2px rgba(74,55,40,.06),0 4px 16px rgba(74,55,40,.06);
  --sidebar:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sand);color:var(--deep);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
h1,h2,.serif{font-family:'Playfair Display',Georgia,serif;letter-spacing:-.01em}
a{color:var(--terracotta)}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:6px}

/* ---------- Login ---------- */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:20px;
  background:radial-gradient(1200px 600px at 20% 10%,#5a4433 0%,var(--bark) 45%,var(--bark-2) 100%);z-index:50}
.login-card{width:100%;max-width:380px;background:var(--cream);border-radius:18px;padding:40px 36px 32px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login-card h1{font-size:34px;color:var(--deep)}
.login-card .kicker{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:2px 0 28px}
.login-card .field{margin-bottom:14px}
.login-card .btn{width:100%;justify-content:center;padding:12px}
.login-msg{font-size:13px;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.login-msg.err{background:var(--red-bg);color:var(--red)}
.login-msg.ok{background:var(--green-bg);color:var(--green)}
.linkbtn{color:var(--terracotta);font-size:13px;text-decoration:underline;text-underline-offset:3px;margin-top:14px;display:inline-block}
.login-foot{margin-top:22px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* ---------- Layout ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--bark);color:#efe6da;display:flex;flex-direction:column;z-index:30;transition:transform .25s ease}
.brand{padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{font-size:25px;color:var(--sand)}
.brand p{color:var(--clay);font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;margin-top:2px}
.nav{padding:14px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.72);font-size:14px;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(196,132,90,.2);color:#fff}
.nav-item .ico{width:20px;text-align:center;font-size:15px}
.nav-item .count{margin-left:auto;background:var(--terracotta);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.side-filter{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08)}
.side-filter label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:6px}
.side-filter select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:8px 10px}
.side-filter select option{color:var(--deep)}
.side-foot{padding:12px 20px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.55)}
.side-foot .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 0}
.side-foot .row{display:flex;gap:6px;flex-wrap:wrap}
.side-foot button{color:rgba(255,255,255,.75);font-size:12px;padding:5px 9px;border:1px solid rgba(255,255,255,.16);border-radius:7px}
.side-foot button:hover{background:rgba(255,255,255,.08);color:#fff}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.saved i{background:#6fcf97}.sync.saving i{background:#f2c94c;animation:pulse 1s infinite}
.sync.error i,.sync.offline i{background:#eb5757}.sync.loading i{background:#f2c94c;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.main{margin-left:var(--sidebar);padding:28px 32px 60px;max-width:1400px}
.topbar{display:none}
.scrim{display:none}
.banner{border-radius:10px;padding:11px 14px;margin-bottom:18px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--amber-bg);color:#7a4f0f;border:1px solid #f1d9a3}
.banner.err{background:var(--red-bg);color:var(--red);border:1px solid #f4c6c0}

/* ---------- Page chrome ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h2{font-size:28px;color:var(--deep);line-height:1.15}
.ph p{color:var(--muted);font-size:13px;margin-top:3px}
.ph .actions{display:flex;gap:8px;flex-wrap:wrap}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-title h3{font-size:15px;font-weight:600}
.section-title .sub{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:6px}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 15px;font-weight:600;font-size:13.5px;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-primary{background:var(--terracotta);color:#fff}
.btn-primary:hover{background:var(--terracotta-2)}
.btn-primary:disabled{opacity:.6;cursor:progress}
.btn-ghost{background:var(--paper);border-color:var(--border-2);color:var(--bark)}
.btn-ghost:hover{border-color:var(--clay);color:var(--terracotta)}
.btn-danger{background:var(--paper);border-color:#f0c2bb;color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);font-size:14px}
.icon-btn:hover{background:var(--grey-bg);color:var(--deep)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:11.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.field>span em{color:var(--terracotta);font-style:normal}
.field small{font-size:11.5px;color:var(--muted)}
.input,.field input,.field select,.field textarea{width:100%;background:var(--paper);border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;outline:none;transition:border-color .15s}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--clay)}
.field textarea{resize:vertical;min-height:64px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{width:auto;padding:8px 11px}
.toolbar .search{flex:1;min-width:180px;max-width:320px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--border-2);border-radius:10px;padding:3px}
.seg button{padding:6px 13px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--bark);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--border-2);background:var(--paper);font-size:12.5px;color:var(--bark)}
.chip.on{background:var(--bark);border-color:var(--bark);color:#fff}

/* ---------- Cards / stats ---------- */
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{padding:16px 18px}
.stat .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .val{font-size:26px;font-weight:700;margin-top:6px;color:var(--deep)}
.stat .val small{font-size:14px;color:var(--muted);font-weight:500}
.stat .sub{font-size:12px;color:var(--muted);margin-top:3px}
.bar{height:6px;background:var(--grey-bg);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--clay),var(--terracotta));border-radius:99px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--border)}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0}
.list-row .t{font-weight:600}
.list-row .s{font-size:12px;color:var(--muted)}
.alert-row{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--border);font-size:13px}
.alert-row:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.dot.red{background:var(--red)}.dot.amber{background:#e0a030}.dot.blue{background:var(--blue)}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prop{padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s}
.prop:hover{border-color:var(--clay)}
.prop .name{font-family:'Playfair Display',serif;font-size:18px;font-weight:700}
.prop .addr{font-size:12px;color:var(--muted);margin-top:2px;min-height:16px}
.prop .kv{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}
.prop .kv b{display:block;font-size:16px;color:var(--deep)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:28px;margin-bottom:6px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse}
.rt th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 14px;background:var(--cream);border-bottom:1px solid var(--border);white-space:nowrap}
.rt th[data-act]{cursor:pointer;user-select:none}
.rt th[data-act]:hover{color:var(--deep)}
.rt td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.rt tr:last-child td{border-bottom:0}
.rt tbody tr[data-act]{cursor:pointer}
.rt tbody tr:hover td{background:#fcfaf6}
.rt tr.muted td{color:var(--muted)}
.rt tr.ghost td{background:repeating-linear-gradient(-45deg,#fff,#fff 8px,#fbf8f3 8px,#fbf8f3 16px)}
.rt td.r,.rt th.r{text-align:right}
.rt tfoot td{font-weight:700;background:var(--cream);border-top:1px solid var(--border)}
.rt .acts{white-space:nowrap;text-align:right;width:1%}
.small{font-size:12px;color:var(--muted)}
.strong{font-weight:600}
code.acct{background:var(--grey-bg);padding:3px 8px;border-radius:6px;font-size:12.5px;letter-spacing:.3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.group-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--cream);border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
.group-h b{font-family:'Playfair Display',serif;font-size:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.grey{background:var(--grey-bg);color:var(--muted)}
.badge.blue{background:var(--blue-bg);color:var(--blue)}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav b{min-width:150px;text-align:center;font-family:'Playfair Display',serif;font-size:19px}
.summary{display:flex;gap:22px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);align-items:center}
.summary b{color:var(--deep);font-size:15px;margin-left:4px}
.summary .bar{flex:1;min-width:120px;margin-top:0}

/* ---------- Docs ---------- */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.doc{padding:16px;display:flex;flex-direction:column;gap:4px}
.doc .ic{font-size:26px;margin-bottom:4px}
.doc .nm{font-weight:600;word-break:break-word}
.doc .meta{font-size:12px;color:var(--muted)}
.doc .foot{display:flex;gap:6px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.reminder{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--border)}
.reminder:first-child{border-top:0}
.reminder.done .t{text-decoration:line-through;color:var(--muted)}
.reminder input[type=checkbox]{width:20px;height:20px;accent-color:var(--terracotta);cursor:pointer;flex-shrink:0}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(31,25,20,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:60;overflow-y:auto}
.modal-card{background:var(--cream);border-radius:16px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .16s ease}
.modal-card.wide{max-width:860px}
.modal-card.narrow{max-width:420px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 4px}
.modal-head h2{font-size:22px}
.modal-body{padding:16px 24px 8px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px 22px;flex-wrap:wrap}
.modal-foot .left{margin-right:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.drop{border:2px dashed var(--border-2);border-radius:10px;padding:18px;text-align:center;color:var(--muted);background:var(--paper);cursor:pointer;transition:border-color .15s,background .15s;font-size:13px}
.drop.over{border-color:var(--clay);background:#fbf2ea}
.drop b{color:var(--deep)}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 18px;margin-bottom:18px}
.kvgrid div span{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.kvgrid div b{font-weight:600;word-break:break-word}
.notes-box{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;white-space:pre-wrap;margin-bottom:18px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 40px))}
.toast{background:var(--deep);color:#fff;border-radius:10px;padding:11px 15px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .16s ease}
.toast.error{background:var(--red)}
.toast.ok::before{content:'✓  ';color:#6fcf97;font-weight:700}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .main{margin-left:0;padding:16px 16px 70px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bark);color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
  .topbar .burger{color:#fff;font-size:20px;width:36px;height:36px}
  .topbar .ttl{font-family:'Playfair Display',serif;font-size:18px;flex:1}
  .ph h2{font-size:23px}
  .ph{margin-bottom:16px}
}
@media (max-width:760px){
  .form-grid{grid-template-columns:1fr}
  .rt thead{display:none}
  .rt,.rt tbody,.rt tfoot{display:block}
  .rt tr{display:block;padding:10px 14px;border-bottom:1px solid var(--border)}
  .rt tr:last-child{border-bottom:0}
  .rt td{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border:0;text-align:right}
  .rt td::before{content:attr(data-l);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;flex-shrink:0}
  .rt td.lead{font-size:15px;justify-content:flex-start;align-items:baseline;flex-wrap:wrap;gap:6px;text-align:left}
  .rt td.lead::before{display:none}
  .rt td.acts{width:auto;justify-content:flex-end;padding-top:6px}
  .rt td.acts::before{display:none}
  .rt td:empty{display:none}
  .rt tfoot td::before{content:attr(data-l)}
  .summary{gap:12px}
  .month-nav b{min-width:120px;font-size:17px}
  .modal{padding:0;align-items:flex-end}
  .modal-card{border-radius:16px 16px 0 0;max-height:94vh;overflow-y:auto}
  .modal-head{padding:18px 18px 2px}.modal-body{padding:14px 18px 6px}.modal-foot{padding:12px 18px calc(18px + env(safe-area-inset-bottom))}
  #toasts{left:16px;right:16px;bottom:16px;max-width:none}
}
@media print{.sidebar,.topbar,.ph .actions,.acts,#toasts,.toolbar{display:none!important}.main{margin:0;padding:0}.card{box-shadow:none}}
</style>
</head>
<body>

<!-- ===================== SIGN IN ===================== -->
<div class="login" id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on" novalidate>
    <h1>Casas</h1>
    <div class="kicker">Property Portal</div>
    <div id="login-msg" class="login-msg" hidden></div>
    <div id="login-fields">
      <label class="field"><span>Email</span><input id="login-email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input id="login-password" type="password" autocomplete="current-password" required></label>
    </div>
    <div id="recovery-fields" hidden>
      <label class="field"><span>New password</span><input id="new-password" type="password" autocomplete="new-password" minlength="10"></label>
    </div>
    <button class="btn btn-primary" id="login-btn" type="submit">Sign in</button>
    <button class="linkbtn" id="forgot-btn" type="button">Forgot password?</button>
    <div class="login-foot">🔒 Signed-in access only. Your data is private to your account.</div>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <header class="topbar">
    <button class="burger" data-act="menu" aria-label="Open menu">☰</button>
    <div class="ttl" id="topbar-title">Casas</div>
    <span class="sync" id="sync-top"><i></i></span>
  </header>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><h1>Casas</h1><p>Property Portal</p></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-filter">
      <label for="prop-filter">Property</label>
      <select id="prop-filter" data-change="prop"></select>
    </div>
    <div class="side-foot">
      <span class="sync" id="sync"><i></i><span>Connecting…</span></span>
      <div class="who" id="who"></div>
      <div class="row">
        <button data-act="refresh" title="Reload the latest data">↻ Refresh</button>
        <button data-act="backup" title="Download a full JSON backup">⤓ Backup</button>
        <button data-act="signout">Sign out</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-act="menu"></div>
  <main class="main">
    <div id="banner"></div>
    <div id="page"></div>
  </main>
</div>

<!-- ===================== MODALS ===================== -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">

const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1aGpydmNyeml2aGlmYmt0cXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTgzNTAsImV4cCI6MjA4Nzg5NDM1MH0.fin9wKwdG0rhjvdchQ9SY93DKfNg79mvZbkFKNvc2uM';

const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

const COLLS = ['properties','tenants','payments','utilities','taxes','documents','alerts','personalDocs'];
const OPT = {

  payMethod: ['Bank Transfer / SPEI','Cash / Efectivo','Check / Cheque','Venmo / PayPal','Other'],

  utilType: ['⚡ Electric (CFE)','💧 Water (SACMEX/Municipal)','🔥 Gas','🌐 Internet','Other'],

  pdocCat: ['ID / Passport','Financial','Legal','Medical','Insurance','Other'],
  repeat: [['monthly','Monthly'],['yearly','Yearly'],['weekly','Weekly']],
  months: [['1','January'],['2','February'],['3','March'],['4','April'],['5','May'],['6','June'],['7','July'],['8','August'],['9','September'],['10','October'],['11','November'],['12','December']],
};
const DOC_ICON = {'Lease Agreement':'📋','Tenant ID':'🪪','Property Deed':'🏠','Insurance':'🛡️','Tax Receipt':'🏛️','Utility Bill':'⚡','Inspection Report':'🔍','ID / Passport':'🛂','Financial':'💳','Legal':'⚖️','Medical':'🏥','Other':'📎'};
const METHOD_ALIAS = { cash: 'Cash / Efectivo', bank_transfer: 'Bank Transfer / SPEI' };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------------- state ---------------- */
let S = emptyState();
let version = null;     // updated_at of the row we last read/wrote (optimistic concurrency)
let ready = false;      // data loaded from the cloud
let readOnly = true;    // editing disabled until a fresh cloud read succeeds
let user = null;
let bannerMsg = null;
const ui = {
  page: lsGet('casas_page') || 'dashboard',
  prop: lsGet('casas_prop') || 'all',
  month: monthKey(new Date()),
  rentTab: 'month',
  paySort: { col: 'month', dir: 'desc' },
  payQ: '', payStatus: '', payYear: '',
  tenQ: '', tenShow: 'current',
  taxYear: String(new Date().getFullYear()),
  docQ: '', docCat: '',
};

/* ---------------- helpers ---------------- */
function emptyState(){ const s = {}; COLLS.forEach(c => s[c] = []); return s; }
function normalize(raw){ const s = {}; for (const k in (raw||{})) s[k] = raw[k]; COLLS.forEach(c => { if (!Array.isArray(s[c])) s[c] = []; }); return s; }
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? n : 0; };
const coll = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function money(v, cur = 'MXN'){ const n = num(v); const s = n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); return (cur === 'USD' ? 'US$' : '$') + s; }
function parseDate(s){ const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +(m[3] || 1)) : null; }
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysUntil(s){ const d = parseDate(s); return d ? Math.round((d - today0()) / 864e5) : null; }
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function addMonths(k, n){ const [y, m] = k.split('-').map(Number); return monthKey(new Date(y, m - 1 + n, 1)); }
function fmtMonth(k, long){ const m = /^(\d{4})-(\d{2})/.exec(k || ''); if (!m) return k || '—'; return (long ? MONTH : MON)[+m[2] - 1] + ' ' + m[1]; }
function fmtDate(s){ const d = parseDate(s); return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'; }
function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } }
function plural(n, w){ return n + ' ' + w + (n === 1 ? '' : 's'); }
function opts(list, sel){ return list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(sel ?? '') ? ' selected' : ''}>${esc(l)}</option>`; }).join(''); }

/* ---------------- domain helpers ---------------- */
const propById = id => S.properties.find(p => p.id === id);
const propName = id => propById(id)?.name || '—';
const tenantById = id => S.tenants.find(t => t.id === id);
const inProp = id => ui.prop === 'all' || id === ui.prop;
const isVacant = t => t.status === 'vacant' || /^\(?\s*vacant\s*\)?$/i.test((t.name || '').trim());
const isFormer = t => t.status === 'former';
const isOccupied = t => !isVacant(t) && !isFormer(t);
function payDay(t){ if (t.payDay) return +t.payDay; const m = /pay\s*date:?\s*(\d{1,2})/i.exec(t.notes || ''); return m ? +m[1] : null; }
function sortedProps(){ return [...S.properties].sort((a, b) => coll.compare(a.name, b.name)); }
function sortedTenants(list = S.tenants){ return [...list].sort((a, b) => coll.compare(propName(a.propertyId), propName(b.propertyId)) || coll.compare(a.unit || '', b.unit || '') || coll.compare(a.name || '', b.name || '')); }
function unitLabel(t){ return esc(propName(t.propertyId)) + (t.unit ? ` <span class="small">· ${esc(t.unit)}</span>` : ''); }
function payView(p){
  const t = tenantById(p.tenantId);
  return { ...p,
    propertyId: p.propertyId || t?.propertyId || '',
    tenantName: p.tenantName || t?.name || 'Unknown tenant',
    method: METHOD_ALIAS[p.method] || p.method || '—',
    status: p.status || 'paid',
    due: (p.due !== undefined && p.due !== '') ? p.due : (t?.rent || ''),
    unit: t?.unit || p.unit || '' };
}
function leaseInfo(t){
  if (isFormer(t)) return { cls: 'grey', label: 'Moved out' };
  if (isVacant(t)) return { cls: 'blue', label: 'Vacant' };
  const d = daysUntil(t.leaseEnd);
  if (d === null) return { cls: 'grey', label: 'No end date' };
  if (d < 0) return { cls: 'red', label: 'Lease expired' };
  if (d <= 60) return { cls: 'amber', label: `Ends in ${d}d` };
  return { cls: 'green', label: 'Active' };
}
function statusBadge(s){ const m = { paid: ['green','Paid'], partial: ['amber','Partial'], late: ['red','Late'], unpaid: ['grey','Unpaid'] }[s] || ['grey', s]; return `<span class="badge ${m[0]}">${esc(m[1])}</span>`; }

/* Rent roll for one month: every occupied unit (plus anyone who paid). */
function rentRoll(month){
  const [y, m] = month.split('-').map(Number);
  const monthEnd = new Date(y, m, 0);
  const pays = S.payments.filter(p => p.month === month).map(payView);
  const seen = new Set(); const rows = [];
  for (const t of sortedTenants()) {
    if (!inProp(t.propertyId)) continue;
    const tp = pays.filter(p => p.tenantId === t.id);
    const ls = parseDate(t.leaseStart);
    const expected = isOccupied(t) && !(ls && ls > monthEnd);
    if (!expected && !tp.length) continue;
    tp.forEach(p => seen.add(p.id));
    const due = num(t.rent) || (tp[0] ? num(tp[0].due) : 0);
    const paid = tp.reduce((s, p) => s + num(p.amount), 0);
    let status = paid <= 0 ? 'unpaid' : (!due || paid + 0.5 >= due ? 'paid' : 'partial');
    if (status === 'paid' && tp.some(p => p.status === 'late')) status = 'late';
    let overdue = false;
    if (status !== 'paid' && status !== 'late' && expected) {
      const pd = payDay(t); const t0 = today0();
      const dueDate = new Date(y, m - 1, Math.min(pd || 1, monthEnd.getDate()));
      overdue = dueDate < t0 && month <= monthKey(t0);
    }
    rows.push({ t, pays: tp, due, paid, status, cur: t.currency || 'MXN', expected, overdue });
  }
  for (const p of pays) if (!seen.has(p.id) && inProp(p.propertyId)) {
    rows.push({ t: { id: p.tenantId, name: p.tenantName, propertyId: p.propertyId, unit: p.unit }, pays: [p], due: num(p.due), paid: num(p.amount), status: p.status, cur: 'MXN', expected: false, orphan: true });
  }
  const exp = rows.filter(r => r.expected);
  return {
    rows,
    expected: exp.reduce((s, r) => s + r.due, 0),
    collected: rows.reduce((s, r) => s + r.paid, 0),
    outstanding: exp.reduce((s, r) => s + Math.max(0, r.due - r.paid), 0),
    unpaid: exp.filter(r => r.status === 'unpaid' || r.status === 'partial'),
  };
}

/* Recurring reminders */
function periodKey(a, d = new Date()){
  if (a.repeat === 'yearly') return String(d.getFullYear());
  if (a.repeat === 'weekly') { const t = new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate() + 3 - (t.getDay() + 6) % 7); const w1 = new Date(t.getFullYear(), 0, 4); return t.getFullYear() + '-W' + (1 + Math.round(((t - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7)); }
  return monthKey(d);
}
function periodDue(a){
  const t = today0();
  if (a.repeat === 'weekly') { const wd = ((+a.day || 1) % 7); const d = new Date(t); d.setDate(t.getDate() - ((t.getDay() + 6) % 7) + ((wd + 6) % 7)); return d; }
  if (a.repeat === 'yearly') { const mo = (+a.month || 1) - 1; const dim = new Date(t.getFullYear(), mo + 1, 0).getDate(); return new Date(t.getFullYear(), mo, Math.min(+a.day || 1, dim)); }
  const dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return new Date(t.getFullYear(), t.getMonth(), Math.min(+a.day || 1, dim));
}
const isDone = a => !!(a.completedMonths && a.completedMonths[periodKey(a)]);
function reminderStatus(a){
  if (a.active === false) return { cls: 'grey', label: 'Paused', days: null };
  if (isDone(a)) return { cls: 'green', label: 'Done', days: null };
  if (!a.day) return { cls: 'green', label: 'Active', days: null };
  const days = Math.round((periodDue(a) - today0()) / 864e5);
  if (days < 0) return { cls: 'red', label: `Overdue ${-days}d`, days };
  if (days === 0) return { cls: 'red', label: 'Due today', days };
  return { cls: days <= 3 ? 'amber' : 'grey', label: `Due in ${days}d`, days };
}

/* Alerts shown on the dashboard */
function buildAlerts(){
  const out = [];
  for (const t of S.tenants) {
    if (!isOccupied(t) || !inProp(t.propertyId) || !t.leaseEnd) continue;
    const d = daysUntil(t.leaseEnd);
    if (d < 0) out.push({ lvl: 'red', html: `<b>${esc(t.name)}</b> (${unitLabel(t)}) — lease ended ${esc(fmtDate(t.leaseEnd))}. Renew or mark month-to-month.`, act: 'tenant', id: t.id });
    else if (d <= 60) out.push({ lvl: 'amber', html: `<b>${esc(t.name)}</b> (${unitLabel(t)}) — lease ends in ${d} days (${esc(fmtDate(t.leaseEnd))}).`, act: 'tenant', id: t.id });
  }
  for (const d of S.documents) {
    if (!d.expiry || !inProp(d.propertyId || ui.prop)) continue;
    const n = daysUntil(d.expiry);
    if (n < 0) out.push({ lvl: 'red', html: `Document <b>${esc(d.name)}</b> expired ${esc(fmtDate(d.expiry))}.` });
    else if (n <= 30) out.push({ lvl: 'amber', html: `Document <b>${esc(d.name)}</b> expires in ${n} days.` });
  }
  const yr = new Date().getFullYear();
  const missing = taxCoverage(String(yr)).missing;
  if (missing.length) out.push({ lvl: new Date().getMonth() >= 3 ? 'red' : 'amber', html: `Predial ${yr} not recorded for <b>${missing.map(k => esc(propName(k.propertyId) + (k.unit ? ' ' + k.unit : ''))).join(', ')}</b>.`, page: 'taxes' });
  for (const a of (S.alerts || [])) {
    const st = reminderStatus(a);
    if (st.days !== null && st.days <= 3) out.push({ lvl: st.days < 0 ? 'red' : 'blue', html: `Reminder: <b>${esc(a.title)}</b> — ${esc(st.label.toLowerCase())}.`, page: 'personal' });
  }
  return out.sort((a, b) => (a.lvl === 'red' ? 0 : 1) - (b.lvl === 'red' ? 0 : 1));
}

function taxCoverage(year){
  const recs = S.taxes.filter(t => String(t.year) === year && inProp(t.propertyId));
  const keys = new Map();
  S.taxes.forEach(t => { if (!inProp(t.propertyId) || num(t.year) < num(year) - 1) return; const k = t.propertyId + '|' + (t.unit || ''); if (!keys.has(k)) keys.set(k, { propertyId: t.propertyId, unit: t.unit || '' }); });
  const have = new Set(recs.map(t => t.propertyId + '|' + (t.unit || '')));
  return { recs, missing: [...keys.values()].filter(k => !have.has(k.propertyId + '|' + k.unit)).sort((a, b) => coll.compare(propName(a.propertyId), propName(b.propertyId)) || coll.compare(a.unit, b.unit)) };
}

/* ---------------- files (private storage, signed links) ---------------- */
function fileRef(rec){
  if (!rec) return null;
  if (rec.docPath && rec.docBucket) return { bucket: rec.docBucket, path: rec.docPath };
  const m = /\/storage\/v1\/object\/(?:public|sign|authenticated)\/([^/]+)\/([^?#]+)/.exec(rec.docUrl || '');
  return m ? { bucket: m[1], path: decodeURIComponent(m[2]) } : null;
}
const hasFile = rec => !!(fileRef(rec) || rec?.docData);
async function openFile(rec){
  if (!rec) return;
  const ref = fileRef(rec);
  if (ref) {
    const w = window.open('', '_blank');
    const { data, error } = await sb.storage.from(ref.bucket).createSignedUrl(ref.path, 300);
    if (error || !data?.signedUrl) { if (w) w.close(); toast('Could not open file: ' + (error?.message || 'not found'), 'error'); return; }
    if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
  } else if (rec.docData) {
    const w = window.open(); if (w) w.document.write(`<iframe src="${esc(rec.docData)}" style="border:0;position:fixed;inset:0;width:100%;height:100%"></iframe>`);
  } else if (safeUrl(rec.link)) window.open(safeUrl(rec.link), '_blank', 'noopener');
}
async function uploadFile(bucket, base, file){
  if (file.size > 25 * 1024 * 1024) { toast('That file is over 25 MB.', 'error'); return null; }
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'bin';
  const path = `${base}.${ext}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { upsert: true, contentType: file.type || undefined });
  if (error) { toast('Upload failed: ' + error.message, 'error'); return null; }
  return { docBucket: bucket, docPath: path, docName: file.name };
}
async function removeFile(ref){ if (ref) { const { error } = await sb.storage.from(ref.bucket).remove([ref.path]); if (error) console.warn('File cleanup:', error.message); } }

/* ---------------- cloud sync ---------------- */
const cacheKey = () => 'casas_cache_v2:' + (user?.id || 'anon');
function writeCache(){ lsSet(cacheKey(), JSON.stringify({ state: S, version, at: Date.now() })); }
function readCache(){ try { return JSON.parse(lsGet(cacheKey()) || 'null'); } catch { return null; } }
function setSync(kind, text){
  const labels = { loading: 'Loading…', saving: 'Saving…', saved: 'All changes saved', error: 'Not saved', offline: 'Offline · read-only' };
  for (const el of [$('#sync'), $('#sync-top')]) { el.className = 'sync ' + kind; const sp = el.querySelector('span'); if (sp) sp.textContent = text || labels[kind] || ''; el.title = text || labels[kind] || ''; }
}
async function fetchState(){
  const { data, error } = await sb.from('app_state').select('data,updated_at').eq('id', 'main').maybeSingle();
  if (error) { console.warn('Load failed:', error.message); return { error }; }
  if (!data) return { missing: true };
  return { state: normalize(data.data), version: data.updated_at };
}
let chain = Promise.resolve();
function commit(mutate){ const run = chain.then(() => doCommit(mutate)); chain = run.catch(() => {}); return run; }
async function doCommit(mutate){
  if (!ready || readOnly) { toast('Editing is paused until the latest data loads. Try Refresh.', 'error'); return false; }
  setSync('saving');
  for (let attempt = 0; attempt < 4; attempt++) {
    const next = structuredClone(S);
    mutate(next);
    const now = new Date().toISOString();
    const { data, error } = await sb.from('app_state').update({ data: next, updated_at: now }).eq('id', 'main').eq('updated_at', version).select('updated_at');
    if (error) { setSync('error'); toast('Save failed: ' + error.message, 'error'); if (/jwt|auth/i.test(error.message)) await sb.auth.refreshSession(); return false; }
    if (data && data.length) { S = next; version = data[0].updated_at; writeCache(); setSync('saved'); render(); return true; }
    // Someone else (another device or the WhatsApp bot) saved first: pull theirs, re-apply ours.
    const fresh = await fetchState();
    if (!fresh.state) { setSync('error'); toast('Could not reach the database to save.', 'error'); return false; }
    S = fresh.state; version = fresh.version;
  }
  setSync('error'); render(); toast('Could not save — the data kept changing. Please try again.', 'error'); return false;
}
async function loadFromCloud(quiet){
  if (!quiet) setSync('loading');
  const fresh = await fetchState();
  if (fresh.state) {
    const changed = fresh.version !== version;
    S = fresh.state; version = fresh.version; ready = true; readOnly = false; bannerMsg = null;
    writeCache(); setSync('saved'); render();
    if (quiet && changed) toast('Updated with the latest changes', 'ok');
    return;
  }
  if (quiet) return;
  readOnly = true;
  if (fresh.missing) { bannerMsg = { cls: 'err', text: 'No portfolio data is visible to this account. If you just set up sign-in, the database may not grant this login access yet — nothing has been changed.' }; ready = true; setSync('offline', 'No data'); }
  else { const c = readCache(); if (c) { S = normalize(c.state); version = c.version; ready = true; } bannerMsg = { cls: 'warn', text: `Couldn't reach the database (${fresh.error?.message || 'network'}). ${c ? 'Showing your last saved copy from ' + new Date(c.at).toLocaleString() + '. ' : ''}Editing is paused — press Refresh to try again.` }; setSync('offline'); }
  render();
}

/* ---------------- auth ---------------- */
let booted = false;
function showLogin(mode){
  $('#app').hidden = true; $('#login').hidden = false;
  const rec = mode === 'recovery';
  $('#login-fields').hidden = rec; $('#recovery-fields').hidden = !rec; $('#forgot-btn').hidden = rec;
  $('#login-btn').textContent = rec ? 'Set new password' : 'Sign in';
  $('#login-form').dataset.mode = rec ? 'recovery' : 'login';
  setTimeout(() => (rec ? $('#new-password') : $('#login-email')).focus(), 50);
}
function loginMsg(text, kind = 'err'){ const el = $('#login-msg'); el.hidden = !text; el.className = 'login-msg ' + kind; el.textContent = text || ''; }
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault(); loginMsg('');
  const btn = $('#login-btn'); btn.disabled = true; const label = btn.textContent; btn.textContent = 'One moment…';
  try {
    if (e.target.dataset.mode === 'recovery') {
      const pw = $('#new-password').value;
      if (pw.length < 10) { loginMsg('Use at least 10 characters.'); return; }
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) loginMsg(error.message); else { history.replaceState(null, '', location.pathname); loginMsg('Password updated.', 'ok'); setTimeout(() => location.reload(), 800); }
    } else {
      const email = $('#login-email').value.trim(), password = $('#login-password').value;
      if (!email || !password) { loginMsg('Enter your email and password.'); return; }
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { loginMsg(error.message === 'Invalid login credentials' ? 'Email or password is incorrect.' : error.message); $('#login-password').value = ''; $('#login-password').focus(); }
    }
  } finally { btn.disabled = false; btn.textContent = label; }
});
$('#forgot-btn').addEventListener('click', async () => {
  const email = $('#login-email').value.trim();
  if (!email) { loginMsg('Enter your email first, then press "Forgot password?".'); $('#login-email').focus(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  loginMsg(error ? error.message : 'If that email has an account, a reset link is on its way.', error ? 'err' : 'ok');
});
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { showLogin('recovery'); return; }
  if (session?.user) {
    const changedUser = user?.id !== session.user.id; user = session.user;

function openTenant(id){
  const t = tenantById(id);
  if (!t) { toast('That tenant is no longer on file.', 'error'); return; }
  const pays = S.payments.filter(p => p.tenantId === id).map(payView).sort((a, b) => coll.compare(b.month || '', a.month || '') || coll.compare(b.date || '', a.date || ''));
  // ledger: from lease start (or first payment) to this month, newest first, max 24 months
  const nowK = monthKey(new Date());
  const firstK = [t.leaseStart ? t.leaseStart.slice(0, 7) : null, pays.length ? pays[pays.length - 1].month : null].filter(Boolean).sort()[0] || addMonths(nowK, -11);
  const months = []; for (let k = nowK; k >= firstK && months.length < 24; k = addMonths(k, -1)) months.push(k);
  pays.forEach(p => { if (p.month && !months.includes(p.month) && months.length < 36) months.push(p.month); });
  months.sort().reverse();
  const rent = num(t.rent); let owed = 0;
  const rows = months.map(k => {
    const mp = pays.filter(p => p.month === k); const paid = mp.reduce((s, p) => s + num(p.amount), 0);
    const ls = parseDate(t.leaseStart); const [y, m] = k.split('-').map(Number);
    const expected = isOccupied(t) && !(ls && ls > new Date(y, m, 0));
    const due = expected ? rent : 0; if (expected) owed += Math.max(0, due - paid);
    const st = paid <= 0 ? (expected ? 'unpaid' : null) : (!due || paid + .5 >= due ? (mp.some(p => p.status === 'late') ? 'late' : 'paid') : 'partial');

    ${docs.length ? `<div class="section-title" style="margin-top:0"><h3>Documents</h3></div><div class="chips" style="margin-bottom:18px">${docs.map(d => `<button class="chip" data-act="open-file" data-coll="documents" data-id="${esc(d.id)}">${DOC_ICON[d.category] || '📎'} ${esc(d.name)}</button>`).join('')}</div>` : ''}

let formCtx = null;
function fieldHtml(f, v, rec){
  const id = 'f-' + f.k; const val = v ?? '';
  let input;
  switch (f.type) {
    case 'select': input = `<select id="${id}">${opts(f.opts, val)}</select>`; break;
    case 'textarea': input = `<textarea id="${id}" rows="3" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`; break;
    case 'property': input = `<select id="${id}">${f.blank ? `<option value="">${esc(f.blank)}</option>` : '<option value="">Choose a property…</option>'}${sortedProps().map(p => `<option value="${esc(p.id)}"${p.id === val ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`; break;
    case 'tenant': {
      const groups = new Map(); sortedTenants(S.tenants.filter(t => !isVacant(t) && (!isFormer(t) || t.id === val))).forEach(t => { const k = propName(t.propertyId); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
      input = `<select id="${id}"><option value="">${esc(f.blank || 'Choose a tenant…')}</option>${[...groups].map(([g, ts]) => `<optgroup label="${esc(g)}">${ts.map(t => `<option value="${esc(t.id)}"${t.id === val ? ' selected' : ''}>${esc((t.unit ? t.unit + ' · ' : '') + t.name)}${isFormer(t) ? ' (moved out)' : ''}</option>`).join('')}</optgroup>`).join('')}</select>`; break; }
    case 'file': input = `<div class="drop" id="drop" tabindex="0"><div id="drop-label">${rec && hasFile(rec) ? `Current file: <b>${esc(rec.docName || 'attached')}</b><br><span class="small">Drop a new file or click to replace</span>` : 'Drop a PDF or photo here, or <b>click to choose</b>'}</div></div><input id="f-file" type="file" accept=".pdf,.jpg,.jpeg,.png,.heic,.webp,.doc,.docx" hidden>`; break;
    default: input = `<input id="${id}" type="${f.type || 'text'}"${f.type === 'number' ? ' step="any" inputmode="decimal"' : ''} value="${esc(val)}" placeholder="${esc(f.ph || '')}">`;
  }
  return `<label class="field${f.full ? ' full' : ''}"><span>${esc(f.label)}${f.req ? ' <em>*</em>' : ''}</span>${input}${f.help ? `<small>${esc(f.help)}</small>` : ''}</label>`;
}
function openForm(kind, id, preset = {}){
  if (readOnly) { toast('Editing is paused until the latest data loads.', 'error'); return; }
  const F = FORMS[kind]; const rec = id ? S[F.coll].find(x => x.id === id) : null;
  if (id && !rec) { toast('That record no longer exists.', 'error'); return; }
  const vals = {}; F.fields.forEach(f => { vals[f.k] = rec ? rec[f.k] : (preset[f.k] ?? (typeof f.def === 'function' ? f.def() : f.def)); });
  if (kind === 'tenant' && rec && isVacant(rec) && rec.status !== 'vacant') vals.status = 'vacant';
  if (kind === 'payment' && rec) vals.method = METHOD_ALIAS[rec.method] || rec.method;
  formCtx = { kind, id, file: null, statusTouched: !!rec };
  openModal((rec ? 'Edit ' : 'New ') + F.title, `<form id="form" class="form-grid" novalidate>${F.fields.map(f => fieldHtml(f, vals[f.k], rec)).join('')}</form>`,
    `${rec ? `<button class="btn btn-danger left" type="button" data-act="del" data-coll="${F.coll}" data-id="${esc(rec.id)}">Delete</button>` : ''}
     <button class="btn btn-ghost" data-act="close">Cancel</button><button class="btn btn-primary" id="form-save" data-act="save-form">${rec ? 'Save changes' : 'Save'}</button>`);
  $('#form').addEventListener('submit', e => { e.preventDefault(); saveForm(); });
  $$('#form input:not([type=file])').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveForm(); } }));
  const drop = $('#drop');
  if (drop) {
    const fi = $('#f-file'); const pick = f => { if (!f) return; formCtx.file = f; $('#drop-label').innerHTML = `Selected: <b>${esc(f.name)}</b> <span class="small">(${(f.size / 1024 / 1024).toFixed(1)} MB)</span>`; };
    drop.onclick = () => fi.click(); drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); } };
    fi.onchange = () => pick(fi.files[0]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files[0]); };
  }
  if (kind === 'payment') wirePaymentForm(!rec);
}
function wirePaymentForm(isNew){
  const ten = $('#f-tenantId'), due = $('#f-due'), amt = $('#f-amount'), st = $('#f-status'), method = $('#f-method'), date = $('#f-date');
  const autoStatus = () => { if (formCtx.statusTouched) return; const d = num(due.value), a = num(amt.value); st.value = !a ? 'unpaid' : (!d || a + .5 >= d ? 'paid' : 'partial'); };
  const fromTenant = () => {
    const t = tenantById(ten.value); if (!t) return;
    if (t.rent) { due.value = t.rent; if (isNew && !amt.value) amt.value = t.rent; }
    if (isNew && /efectivo|cash/i.test(t.notes || '') && !/bank|banamex|banorte|scotia|bancomer|transfer/i.test(t.notes || '')) method.value = 'Cash / Efectivo';
    autoStatus();
  };
  ten.addEventListener('change', fromTenant); due.addEventListener('input', autoStatus); amt.addEventListener('input', autoStatus);
  st.addEventListener('change', () => { formCtx.statusTouched = true; });
  if (isNew) { if (!date.value) date.value = isoDate(new Date()); if (!$('#f-month').value) $('#f-month').value = ui.rentTab === 'month' && ui.page === 'rent' ? ui.month : monthKey(new Date()); if (ten.value) fromTenant(); }
}
async function saveForm(){
  if (!formCtx) return;
  const { kind, id } = formCtx; const F = FORMS[kind];
  const vals = {};
  for (const f of F.fields) {
    if (f.type === 'file') continue;
    const el = $('#f-' + f.k); let v = el.value; if (typeof v === 'string') v = v.trim();
    if (f.req && !v) { el.focus(); toast(`${f.label} is required.`, 'error'); return; }
    if (f.type === 'url' && v && !safeUrl(v)) { el.focus(); toast('Links must start with http:// or https://', 'error'); return; }
    vals[f.k] = v;
  }
  if (kind === 'payment') { const t = tenantById(vals.tenantId); vals.tenantName = t?.name || ''; vals.propertyId = t?.propertyId || ''; }
  if (kind === 'alert') { vals.day = vals.day ? Math.max(1, Math.min(31, parseInt(vals.day, 10))) : null; }
  if (kind === 'tenant' && vals.payDay) vals.payDay = String(Math.max(1, Math.min(31, parseInt(vals.payDay, 10) || 1)));
  const btn = $('#form-save'); btn.disabled = true; btn.textContent = formCtx.file ? 'Uploading…' : 'Saving…';
  const recId = id || uid();
  const existing = id ? S[F.coll].find(x => x.id === id) : null;
  let fileInfo = null;
  if (formCtx.file) { fileInfo = await uploadFile(F.bucket, (F.prefix || '') + recId, formCtx.file); if (!fileInfo) { btn.disabled = false; btn.textContent = 'Save'; return; } }
  const oldRef = fileInfo && existing ? fileRef(existing) : null;
  const ok = await commit(st => {
    const arr = st[F.coll];
    if (id) {
      const i = arr.findIndex(x => x.id === id); if (i < 0) return;
      const merged = { ...arr[i], ...vals, ...(fileInfo || {}) };
      if (fileInfo) { delete merged.docUrl; delete merged.docData; }
      if (kind === 'payment') merged.updatedAt = new Date().toISOString();
      arr[i] = merged;
    } else {
      const rec = { id: recId, ...vals, ...(fileInfo || {}) };
      if (kind === 'payment') rec.createdAt = new Date().toISOString();
      if (kind === 'alert') rec.active = true;
      arr.push(rec);
    }
  });
  if (ok) {
    if (oldRef && !(oldRef.bucket === fileInfo.docBucket && oldRef.path === fileInfo.docPath)) removeFile(oldRef);
    closeModal(); toast(id ? 'Changes saved' : `${F.title[0].toUpperCase() + F.title.slice(1)} added`, 'ok');
  } else if (btn.isConnected) { btn.disabled = false; btn.textContent = 'Save'; }
}
async function deleteRecord(collName, id){
  const rec = S[collName].find(x => x.id === id); if (!rec) return;
  const label = rec.name || rec.title || rec.tenantName || (collName === 'taxes' ? `predial ${rec.year} · ${propName(rec.propertyId)}` : 'this record');
  let extra = '';
  if (collName === 'tenants') { const n = S.payments.filter(p => p.tenantId === id).length; extra = n ? ` Their ${plural(n, 'payment')} will stay in history. To keep them on file instead, edit the tenant and set status to "Moved out".` : ''; }
  if (!await confirmBox(`Delete ${label}?`, `This can't be undone.${hasFile(rec) ? ' The attached file will be deleted too.' : ''}${extra}`)) return;
  const ref = fileRef(rec);
  const ok = await commit(st => { st[collName] = st[collName].filter(x => x.id !== id); });
  if (ok) { if (ref) removeFile(ref); closeModal(); toast('Deleted', 'ok'); }
}

/* ---------------- actions ---------------- */
const ACT = {
  go: id => { ui.page = id; lsSet('casas_page', id); $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); closeModal(); render(); window.scrollTo(0, 0); },
  menu: () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('open'); },
  'filter-prop': id => { ui.prop = id; lsSet('casas_prop', id); render(); },
  refresh: () => loadFromCloud(),
  signout: () => signOut(),
  close: () => closeModal(),
  'save-form': () => saveForm(),
  backup: () => { download(`casas-backup-${stamp()}.json`, JSON.stringify(S, null, 2), 'application/json'); toast('Backup downloaded', 'ok'); },
  'export-csv': () => {
    const ps = ui.rentTab === 'history' ? filteredPayments() : S.payments.map(payView).filter(p => p.month === ui.month && inProp(p.propertyId));
    const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = [['Rent month','Tenant','Property','Unit','Rent due','Amount paid','Date paid','Method','Status','Reference','Notes'],
      ...ps.map(p => [p.month, p.tenantName, propName(p.propertyId), p.unit, num(p.due) || '', num(p.amount), p.date, p.method, p.status, p.reference, p.notes])];
    download(`rent-payments-${ui.rentTab === 'history' ? 'history' : ui.month}-${stamp()}.csv`, '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  },
  'rent-tab': id => { ui.rentTab = id; render(); },
  month: id => { ui.month = id === '0' ? monthKey(new Date()) : addMonths(ui.month, +id); render(); },
  sort: id => { const s = ui.paySort; if (s.col === id) s.dir = s.dir === 'asc' ? 'desc' : 'asc'; else { s.col = id; s.dir = ['month','date','amount','due'].includes(id) ? 'desc' : 'asc'; } render(); },
  'ten-show': id => { ui.tenShow = id; render(); },
  'tax-year': id => { ui.taxYear = id; render(); },
  tenant: id => openTenant(id),
  copy: (_, el) => { const t = el.dataset.text; (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast('Copied ' + t, 'ok'), () => toast(t)); },
  'open-file': (id, el) => openFile(S[el.dataset.coll]?.find(x => x.id === id)),
  del: (id, el) => deleteRecord(el.dataset.coll, id),
  'new-property': () => openForm('property'), 'edit-property': id => openForm('property', id),
  'new-tenant': () => openForm('tenant', null, ui.prop !== 'all' ? { propertyId: ui.prop } : {}), 'edit-tenant': id => openForm('tenant', id),
  'new-payment': (id, el) => openForm('payment', null, { tenantId: id || '', month: el.dataset.month || '' }), 'edit-payment': id => openForm('payment', id),
  'new-utility': () => openForm('utility', null, ui.prop !== 'all' ? { propertyId: ui.prop } : {}), 'edit-utility': id => openForm('utility', id),
  'new-tax': (_, el) => openForm('tax', null, { propertyId: el.dataset.prop || (ui.prop !== 'all' ? ui.prop : ''), unit: el.dataset.unit || '', year: ui.taxYear }), 'edit-tax': id => openForm('tax', id),
  'new-document': () => openForm('document', null, ui.prop !== 'all' ? { propertyId: ui.prop } : {}), 'edit-document': id => openForm('document', id),
  'new-pdoc': () => openForm('pdoc'), 'edit-pdoc': id => openForm('pdoc', id),
  'new-alert': () => openForm('alert'), 'edit-alert': id => openForm('alert', id),
  'alert-done': id => commit(st => { const a = st.alerts.find(x => x.id === id); if (!a) return; a.completedMonths = a.completedMonths || {}; const k = periodKey(a); a.completedMonths[k] = !a.completedMonths[k]; }),
  'alert-pause': id => commit(st => { const a = st.alerts.find(x => x.id === id); if (a) a.active = a.active === false; }),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  if (el.closest('#modal') && ['tenant'].includes(el.dataset.act)) closeModal();
  if (['edit-payment','new-payment','edit-tenant'].includes(el.dataset.act) && !$('#modal').hidden) closeModal();
  fn(el.dataset.id, el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  const k = el.dataset.change;
  if (k === 'prop') { ui.prop = el.value; lsSet('casas_prop', el.value); $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); }
  else ui[k] = el.value;
  render();
});
let inputTimer = null;
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]'); if (!el) return;
  ui[el.dataset.input] = el.value; clearTimeout(inputTimer); inputTimer = setTimeout(render, 120);
});
</script>
